<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Глосс-анализатор</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        textarea { width: 100%; height: 80px; }
        button { margin-top: 10px; padding: 8px 16px; }
        pre { background: #f5f5f5; padding: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Локализация языков по глоссам</h2>
    <p>Введите глоссированный текст:</p>
    <textarea id="glossInput" placeholder="мальчик-NOM увидел-девочку-ACC"></textarea>
    <br>
    <button onclick="analyze()">Анализировать</button>
    <h3>Результат:</h3>
    <pre id="result">Здесь появится ответ...</pre>

    <script>
        // Замените на ваш URL от Render!
        const API_URL = 'https://programirovanie-1.onrender.com';

        async function analyze() {
            const text = document.getElementById('glossInput').value;
            const resultBlock = document.getElementById('result');
            resultBlock.textContent = 'Анализирую...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                resultBlock.textContent = data.analysis;
            } catch (error) {
                resultBlock.textContent = 'Ошибка соединения с сервером: ' + error;
            }
        }
    </script>
</body>
</html>

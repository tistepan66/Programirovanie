<!DOCTYPE html>
<html lang="ru".>
<head>
  <meta charset="UTF-8">
    <title>Локализация языков по глоссам</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    textarea, input { width: 100%; padding: 10px; margin-top: 5px; }
    button { padding: 12px 24px; margin-top: 15px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    pre { background: #f5f5f5; padding: 15px; white-space: pre-wrap; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h2>🌍 Локализация языков по типологическим паттернам</h2>
  <label for="glosses"><strong>Глоссированный текст:</strong></label>
  <textarea id="glosses" placeholder="я-ERG-1SG собака-ABS видеть-PST-PFV"></textarea>
  <small>Пример: мальчик-NOM увидел-девочку-ACC</small>
  <label for="tags" style="margin-top:15px;"><strong>Теги частей речи (через пробел):</strong></label>
  <input type="text" id="tags" placeholder="N V N">
  <small>N — существительное, V — глагол, PRO — местоимение и т.д.</small>

  <br>
  <button onclick="analyze()">Анализировать</button>

  <h3>Результат:</h3>
  <pre id="result">Здесь появится ответ...</pre>


  <script>
        // ВСТАВЬ СЮДА СВОЙ URL от Render
        const API_URL = 'https://glossing-machine.onrender.com';

        async function analyze() {
            const glossed = document.getElementById('glosses').value.trim();
            const tags = document.getElementById('tags').value.trim();
            const resultBlock = document.getElementById('result');

            if (!glossed || !tags) {
                resultBlock.textContent = 'Пожалуйста, заполните оба поля.';
                return;
            }

            resultBlock.textContent = 'Анализирую...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ glossed: glossed, tags: tags })
                });
                const data = await response.json();
                resultBlock.textContent = data.analysis;
            } catch (error) {
                resultBlock.textContent = 'Ошибка соединения с сервером: ' + error;
            }
        }
    </script>
</body>
</html>
